<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt lại mật khẩu - Book Online</title>
    <meta charset="UTF-8">
</head>
<body>
<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px;">

    <h1 style="color: #F08080; text-align: center; border-bottom: 2px solid #F08080; padding-bottom: 10px;">
        BOOK ONLINE
    </h1>

    <h2 style="color: #333; font-weight: normal;">
        Xin chào!
    </h2>

    <p style="font-size: 16px; line-height: 1.5; color: #555;">
        Chúng tôi đã nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.
        Vui lòng nhấn vào
        <a th:href="${resetPasswordLink}"
           style="color: #F08080; text-decoration: none; font-weight: bold;">
            đây
        </a>
        để đặt lại mật khẩu của bạn.
    </p>

    <p style="font-size: 14px; color: #777;">
        Nếu bạn không yêu cầu điều này, xin vui lòng bỏ qua email này.
    </p>

    <p style="font-size: 14px; color: #333; margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 10px;">
        Trân trọng,<br>
        <strong>Đội ngũ Book Online</strong>
    </p>
</div>
</body>
</html>
