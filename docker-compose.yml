services:

  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: bookonline_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"  # Đổi port host sang 3307 để tránh conflict
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # (tuỳ chọn) chạy SQL khi khởi tạo
    networks:
      - bookonline_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookonline_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DB_HOST trỏ sang container mysql
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookonline_net

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  mysql_data:

networks:
  bookonline_net:
    driver: bridge